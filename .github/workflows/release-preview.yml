name: Build downloadable preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and package preview
        run: bash scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Pawlet-Mac-preview
          path: dist/*
          if-no-files-found: error
